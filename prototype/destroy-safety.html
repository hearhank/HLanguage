<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H 原型 #1 · 销毁安全模拟器（可丢弃）</title>
<style>
  :root {
    --accent: #2f6fed;
    --bg: #f7f8fa;
    --card: #ffffff;
    --line: #e3e6eb;
    --ok: #1a9e5c;
    --warn: #d64545;
    --muted: #7a8494;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: #1c2430;
    padding: 24px; line-height: 1.55;
  }
  header { max-width: 900px; margin: 0 auto 20px; }
  h1 { font-size: 22px; }
  header p { color: var(--muted); margin-top: 6px; font-size: 14px; }
  main { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  section h2 { font-size: 15px; margin-bottom: 10px; color: #33404f; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }

  /* 作用域树 */
  .scopes ul { list-style: none; padding-left: 18px; }
  .scopes > ul { padding-left: 0; }
  .scope {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 3px 10px; border-radius: 6px; margin: 2px 0;
    border: 1px solid var(--line); font-size: 13px;
  }
  .scope.current { border-color: var(--accent); background: #eef4ff; }
  .scope.dead { opacity: .45; text-decoration: line-through; }
  .scope .tag { font-size: 11px; color: var(--muted); }

  /* 数据/指针卡片 */
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; min-width: 150px; background: #fbfcfe;
  }
  .item.dead { opacity: .45; }
  .item .name { font-weight: 600; }
  .item .kind { font-size: 11px; color: var(--muted); }
  .item .flag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .flag.bidir { background: #e8f3ff; color: #1b5fc4; }
  .flag.ref { background: #fff3e0; color: #b26a00; }
  .flag.ro { background: #eef0f4; color: #5a6572; }
  .flag.dead-flag { background: #fde8e8; color: var(--warn); }
  .flag.notified { background: #e7f6ee; color: var(--ok); }
  .btns { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid #c9d2dd; background: #fff; color: #24303d;
    border-radius: 6px; padding: 2px 9px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #2558c4; color: #fff; }
  button.danger { color: var(--warn); border-color: #eec4c4; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* 场景 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 5px 12px; font-size: 13px; cursor: pointer; color: #44505e;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scenario-desc { font-size: 13px; color: #44505e; background: #f4f6f9; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .step-line { font-size: 13px; margin-top: 8px; color: var(--muted); }
  .step-line .done { color: var(--ok); }
  .step-line .pending { color: #a3adba; }

  /* 日志 */
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-height: 240px; overflow-y: auto; }
  #log div { padding: 3px 0; border-bottom: 1px dashed #eef1f5; }
  #log .warn { color: var(--warn); }
  #log .ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>H 语言原型 #1 · 销毁安全模拟器</h1>
  <p>验证的核心问题：<b>单一所有权 + 显式 move + 双向引用通知</b>这套模型，在嵌套作用域、move、逃逸尝试等边界情况下，是否真的"不会悬垂"？右侧数据/指针卡片上的按钮可以自由试玩；下方场景标签页有引导步骤。</p>
</header>

<main>
  <section class="scopes">
    <h2>作用域树</h2>
    <div id="scope-view" class="scopes"></div>
  </section>

  <div class="cols">
    <section>
      <h2>数据与变量</h2>
      <div id="data-view" class="items"></div>
    </section>
    <section>
      <h2>指针</h2>
      <div id="ptr-view" class="items"></div>
    </section>
  </div>

  <section>
    <h2>全局操作</h2>
    <div id="global-btns"></div>
  </section>

  <section>
    <h2>引导场景</h2>
    <div class="tabs" id="tabs"></div>
    <div class="scenario-desc" id="scenario-desc"></div>
    <div id="scenario-step"></div>
    <button class="primary" id="next-step">下一步</button>
    <button id="reset-scenario">重置场景</button>
  </section>

  <section>
    <h2>操作日志</h2>
    <div id="log"></div>
  </section>
</main>

<script>
/* ============================================================
 * 纯逻辑模块 —— 可移植（模拟 H 语言的销毁安全运行时）
 * 不引用 DOM。页面壳只调用 createState / step / 读取 state。
 * ============================================================ */
function createState() {
  const root = { id: 0, parent: null, children: [], alive: true, name: "全局" };
  return {
    nextId: 1,
    scopes: { 0: root },
    current: 0,
    datas: {},
    vars: {},
    ptrs: {},
    links: {},          // dataId -> [ptrId]（双向引用注册表）
    log: [],
  };
}

function log(s, msg, cls) { s.log.push({ msg, cls: cls || "" }); }

function removeLink(s, p) {
  const arr = s.links[p.dataId];
  if (arr) { const i = arr.indexOf(p.id); if (i >= 0) arr.splice(i, 1); }
}

function killPointer(s, p, why, cls) {
  if (!p.alive) return;
  p.alive = false;
  removeLink(s, p);
  if (why === "notify") p.notified = true;
  if (why === "moved") p.movedInvalid = true;
  if (why === "release") p.released = true;
  log(s, "· " + p.name + " 失效（" + (why === "notify" ? "数据销毁通知" : why === "moved" ? "move 使全部指针失效" : "指针销毁") + "）", cls);
}

function step(s, a) {
  switch (a.t) {

    case "enterScope": {
      const id = s.nextId++;
      s.scopes[id] = { id, parent: s.current, children: [], alive: true, name: "作用域 #" + id };
      s.scopes[s.current].children.push(id);
      s.current = id;
      log(s, "▶ 进入 " + s.scopes[id].name, "ok");
      break;
    }

    case "exitScope": {
      const sc = s.scopes[s.current];
      if (sc.id === 0) { log(s, "⛔ 不能退出全局作用域", "warn"); break; }
      const destroyed = [];
      for (const v of Object.values(s.vars)) {
        if (v.scopeId === sc.id && v.alive) {
          v.alive = false;
          const d = s.datas[v.dataId];
          if (d && d.alive) {
            d.alive = false;
            destroyed.push(d);
            if (d.kind === "tree") {
              for (const pid of (s.links[d.id] || []).slice()) {
                const p = s.ptrs[pid];
                if (p) killPointer(s, p, "notify", "ok");
              }
              s.links[d.id] = [];
            }
          }
        }
      }
      for (const p of Object.values(s.ptrs)) {
        if (p.scopeId === sc.id && p.alive) killPointer(s, p, "release");
      }
      sc.alive = false;
      s.current = sc.parent;
      log(s, "◀ 退出 " + sc.name + (destroyed.length ? " —— 销毁了 " + destroyed.map(d => d.name).join("、") : ""), "ok");
      break;
    }

    case "createData": {
      const id = s.nextId++;
      const vid = s.nextId++;
      const d = { id, kind: a.kind, name: a.name, alive: true, ownerScope: s.current, ownerVar: vid };
      s.datas[id] = d;
      s.vars[vid] = { id: vid, name: a.name, dataId: id, mut: a.mut !== false, scopeId: s.current, alive: true };
      s.links[id] = [];
      log(s, "📦 创建" + (a.kind === "tree" ? "树" : "块") + " " + a.name + "（变量 " + a.name + " 拥有所有权，当前作用域）", "ok");
      break;
    }

    case "createPtr": {
      const d = s.datas[a.dataId];
      if (!d || !d.alive) { log(s, "⛔ 不能创建指针：数据已销毁", "warn"); break; }
      const bidir = a.kind === "ref" || a.bidir;
      const id = s.nextId++;
      const p = { id, name: a.name, dataId: d.id, kind: a.kind, bidir, scopeId: s.current, alive: true };
      s.ptrs[id] = p;
      if (bidir) s.links[d.id].push(id);
      const note = d.kind === "block"
        ? "（块数据：指针只受静态作用域约束，无通知——块销毁即随作用域销毁）"
        : bidir ? "（双向引用：数据销毁会通知）" : "（无双向引用：只能活在数据所有者作用域内）";
      log(s, "👆 创建" + (a.kind === "ref" ? "可写指针 ref " : "只读指针 ") + a.name + " → " + d.name + " " + note, "");
      break;
    }

    case "releasePtr": {
      const p = s.ptrs[a.ptrId];
      if (!p || !p.alive) { log(s, "⛔ 指针不存在或已失效", "warn"); break; }
      killPointer(s, p, "release");
      log(s, "🗑 销毁指针 " + p.name + "（解除双向链接）", "");
      break;
    }

    case "readPtr": {
      const p = s.ptrs[a.ptrId];
      if (!p || !p.alive) { log(s, "⛔ 指针 " + (p && p.name) + " 已失效，不能读", "warn"); break; }
      const d = s.datas[p.dataId];
      if (!d || !d.alive) { log(s, "⛔ 悬垂访问！指针 " + p.name + " 指向的数据已销毁——本不该发生（静态规则漏洞）", "warn"); p.failed = true; break; }
      log(s, "📖 读 " + d.name + "（经 " + p.name + "）", "");
      break;
    }

    case "writePtr": {
      const p = s.ptrs[a.ptrId];
      if (!p || !p.alive) { log(s, "⛔ 指针 " + (p && p.name) + " 已失效，不能写", "warn"); break; }
      const d = s.datas[p.dataId];
      if (!d || !d.alive) { log(s, "⛔ 悬垂写！", "warn"); p.failed = true; break; }
      if (p.kind !== "ref") { log(s, "⛔ 违规：只读指针 " + p.name + " 不能写（写必须显式 ref）", "warn"); p.failed = true; break; }
      const v = s.vars[d.ownerVar];
      if (v && !v.mut) { log(s, "⛔ 违规：数据 " + d.name + " 的变量不可写（只读变量只能 move 或只读指针）", "warn"); p.failed = true; break; }
      log(s, "✏️ 写 " + d.name + "（经 " + p.name + "）", "");
      break;
    }

    case "moveVar": {
      const v = s.vars[a.varId];
      if (!v || !v.alive) { log(s, "⛔ 变量已失效，不能 move", "warn"); break; }
      const d = s.datas[v.dataId];
      const nid = s.nextId++;
      s.vars[nid] = { id: nid, name: a.name || v.name, dataId: d.id, mut: v.mut, scopeId: s.current, alive: true };
      d.ownerVar = nid;
      v.alive = false;
      /* move 使全部指针失效——注意：不只双向引用注册表里的指针，
         只读指针（无注册）也必须失效（遍历全部指针） */
      let nKilled = 0;
      for (const p of Object.values(s.ptrs)) {
        if (p.dataId === d.id && p.alive) { killPointer(s, p, "moved", "warn"); nKilled++; }
      }
      s.links[d.id] = [];
      log(s, "🚚 move " + v.name + " → " + (a.name || v.name) + "（原变量失效；" + nKilled + " 个指针失效）", "ok");
      break;
    }

    case "copyVar": {
      const v = s.vars[a.varId];
      if (!v || !v.alive) { log(s, "⛔ 变量已失效，不能复制", "warn"); break; }
      const d = s.datas[v.dataId];
      if (d.kind !== "block") { log(s, "⛔ 树不能复制——只能 move 或引用（复制会破坏身份与生命周期）", "warn"); break; }
      const nid = s.nextId++, did = s.nextId++;
      const name = a.name || (d.name + " 副本");
      s.datas[did] = { id: did, kind: "block", name, alive: true, ownerScope: s.current, ownerVar: nid };
      s.vars[nid] = { id: nid, name, dataId: did, mut: v.mut, scopeId: s.current, alive: true };
      s.links[did] = [];
      log(s, "📋 复制块 " + d.name + " → " + name + "（memcpy，互不影响）", "ok");
      break;
    }

    case "escapePtr": {
      const p = s.ptrs[a.ptrId];
      if (!p || !p.alive) { log(s, "⛔ 指针不存在或已失效", "warn"); break; }
      if (p.bidir) {
        log(s, "✅ 逃逸被允许：" + p.name + " 是双向引用——数据销毁时会收到通知，安全", "ok");
      } else {
        log(s, "⛔ 逃逸被静态作用域规则拦截：" + p.name + " 无双向引用，不能逃出数据所有者作用域。若需逃逸请创建 ref/双向引用指针", "warn");
        p.failed = true;
      }
      break;
    }

    default: log(s, "未知操作 " + a.t, "warn");
  }
  return s;
}
/* ============ 纯逻辑模块结束 ============ */

/* ============ 页面壳（可丢弃） ============ */
let state = createState();

function render() {
  renderScopes(); renderDatas(); renderPtrs(); renderLog();
}

function renderScopes() {
  const wrap = document.getElementById("scope-view");
  const walk = (id) => {
    const sc = state.scopes[id];
    const cls = ["scope", sc.id === state.current ? "current" : "", sc.alive ? "" : "dead"].join(" ");
    const el = document.createElement("li");
    el.innerHTML = `<span class="${cls}">${sc.name}${sc.id === state.current ? ' <span class="tag">当前</span>' : ""}</span>`;
    if (sc.children.length) {
      const ul = document.createElement("ul");
      sc.children.forEach(c => ul.appendChild(walk(c)));
      el.appendChild(ul);
    }
    return el;
  };
  wrap.innerHTML = "";
  wrap.appendChild(walk(0));
}

function renderDatas() {
  const wrap = document.getElementById("data-view");
  wrap.innerHTML = "";
  const ds = Object.values(state.datas);
  if (!ds.length) { wrap.innerHTML = '<span class="empty">还没有数据——点"创建树/创建块"开始</span>'; return; }
  ds.forEach(d => {
    const v = state.vars[d.ownerVar];
    const card = document.createElement("div");
    card.className = "item" + (d.alive ? "" : " dead");
    const mut = v && v.mut ? "可写" : "只读";
    card.innerHTML = `
      <div><span class="name">${d.name}</span> <span class="kind">${d.kind === "tree" ? "树" : "块"}</span>
        ${d.alive ? "" : '<span class="flag dead-flag">已销毁</span>'}</div>
      <div class="kind">${d.kind === "tree" ? "非连续 · 生命周期 · 可序列化" : "连续 · 复制语义"} · ${mut}</div>
      ${d.alive ? `<div class="btns">
        <button data-act='{"t":"createPtr","dataId":${d.id},"kind":"ref","name":"ref-${d.name}"}'>ref→</button>
        <button data-act='{"t":"createPtr","dataId":${d.id},"kind":"ro","name":"ro-${d.name}"}'>只读→</button>
        <button data-act='{"t":"moveVar","varId":${v.id},"name":"${d.name}@移动"}'>move</button>
        ${d.kind === "block" ? `<button data-act='{"t":"copyVar","varId":${v.id}}'>复制</button>` : ""}
      </div>` : ""}`;
    wrap.appendChild(card);
  });
}

function renderPtrs() {
  const wrap = document.getElementById("ptr-view");
  wrap.innerHTML = "";
  const ps = Object.values(state.ptrs);
  if (!ps.length) { wrap.innerHTML = '<span class="empty">还没有指针</span>'; return; }
  ps.forEach(p => {
    const d = state.datas[p.dataId];
    const card = document.createElement("div");
    card.className = "item" + (p.alive ? "" : " dead");
    let flags = p.kind === "ref" ? '<span class="flag ref">可写</span>' : '<span class="flag ro">只读</span>';
    if (p.bidir) flags += '<span class="flag bidir">双向引用</span>';
    if (p.notified) flags += '<span class="flag notified">已通知失效</span>';
    if (p.movedInvalid) flags += '<span class="flag dead-flag">move 失效</span>';
    if (p.released) flags += '<span class="flag">已销毁</span>';
    if (p.failed) flags += '<span class="flag dead-flag">违规!</span>';
    card.innerHTML = `
      <div><span class="name">${p.name}</span> <span class="kind">→ ${d ? d.name : "?"}</span></div>
      <div>${flags}</div>
      ${p.alive ? `<div class="btns">
        <button data-act='{"t":"readPtr","ptrId":${p.id}}'>读</button>
        <button data-act='{"t":"writePtr","ptrId":${p.id}}'>写</button>
        <button data-act='{"t":"escapePtr","ptrId":${p.id}}'>逃逸</button>
        <button data-act='{"t":"releasePtr","ptrId":${p.id}}'>销毁</button>
      </div>` : ""}`;
    wrap.appendChild(card);
  });
}

function renderLog() {
  const wrap = document.getElementById("log");
  wrap.innerHTML = "";
  state.log.forEach(e => {
    const div = document.createElement("div");
    div.className = e.cls;
    div.textContent = e.msg;
    wrap.appendChild(div);
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function doAction(act) {
  step(state, act);
  render();
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (btn) { doAction(JSON.parse(btn.dataset.act)); }
});

document.getElementById("global-btns").innerHTML = `
  <button class="primary" data-act='{"t":"createData","kind":"tree","name":"account"}'>创建树 account</button>
  <button data-act='{"t":"createData","kind":"block","name":"order"}'>创建块 order</button>
  <button class="primary" data-act='{"t":"enterScope"}'>进入子作用域</button>
  <button data-act='{"t":"exitScope"}'>退出作用域</button>
`;

/* ---------- 引导场景 ---------- */
const SCENARIOS = [
  {
    title: "正常销毁通知",
    desc: "最核心的场景：树数据拥有 ref 指针（双向引用）。退出作用域销毁数据时，指针收到通知失效。观察右侧指针卡片的'已通知失效'标记。",
    steps: [
      { label: "进入子作用域（数据在子作用域内，才能安全退出销毁）", act: { t: "enterScope" } },
      { label: "创建树 account（当前作用域拥有所有权）", act: { t: "createData", kind: "tree", name: "account" } },
      { label: "创建 ref 指针 view → account（自动双向引用）", act: { t: "createPtr", dataRef: "account", kind: "ref", name: "view" } },
      { label: "通过 view 写 account", act: { t: "writePtr", ptrRef: "view" } },
      { label: "退出作用域 → account 销毁 → 通知 view 失效", act: { t: "exitScope" } },
      { label: "再试读 view → 被拒绝（已失效）", act: { t: "readPtr", ptrRef: "view" } },
    ],
  },
  {
    title: "move 使全部指针失效",
    desc: "所有权移动是显式的。move 之后：原变量失效、所有指向该数据的指针全部失效——防止'指针还活着、数据已经易主'。",
    steps: [
      { label: "创建树 t", act: { t: "createData", kind: "tree", name: "t" } },
      { label: "创建可写指针 r1 → t", act: { t: "createPtr", dataRef: "t", kind: "ref", name: "r1" } },
      { label: "创建只读指针 r2 → t", act: { t: "createPtr", dataRef: "t", kind: "ro", name: "r2" } },
      { label: "move t → t2（所有权转移）", act: { t: "moveVar", varRef: "t", name: "t2" } },
      { label: "观察：r1、r2 全部标为 move 失效；再读 r1 被拒绝", act: { t: "readPtr", ptrRef: "r1" } },
    ],
  },
  {
    title: "逃逸的两种命运",
    desc: "只读指针默认无双向引用——被静态作用域规则限制在所有者作用域内（逃逸尝试被拦截）。双向引用指针可以安全'逃逸'：数据销毁时收到通知。",
    steps: [
      { label: "进入子作用域", act: { t: "enterScope" } },
      { label: "创建树 t", act: { t: "createData", kind: "tree", name: "t" } },
      { label: "创建只读指针 ro（无双向引用）", act: { t: "createPtr", dataRef: "t", kind: "ro", name: "ro" } },
      { label: "尝试让 ro 逃逸 → 被静态规则拦截", act: { t: "escapePtr", ptrRef: "ro" } },
      { label: "创建 ref 指针 r（双向引用）", act: { t: "createPtr", dataRef: "t", kind: "ref", name: "r" } },
      { label: "r 逃逸 → 被允许（数据销毁时通知）", act: { t: "escapePtr", ptrRef: "r" } },
      { label: "退出作用域 → r 收到通知安全失效，ro 也随作用域销毁", act: { t: "exitScope" } },
    ],
  },
  {
    title: "块数据对照",
    desc: "块是纯数据：复制 = memcpy（互不影响）；move = 变量失效但无指针（块不需要通知机制）；树不能复制，只能 move 或引用。",
    steps: [
      { label: "创建块 b", act: { t: "createData", kind: "block", name: "b" } },
      { label: "复制 b → b 副本（memcpy，互不影响）", act: { t: "copyVar", varRef: "b" } },
      { label: "创建树 t，尝试复制 → 被拒绝", act: { t: "createData", kind: "tree", name: "t" } },
      { label: "复制树 t → 拒绝（树只能 move 或引用）", act: { t: "copyVar", varRef: "t" } },
      { label: "move 块 b → b3（块无指针，仅变量失效）", act: { t: "moveVar", varRef: "b", name: "b3" } },
    ],
  },
  {
    title: "嵌套作用域",
    desc: "内层作用域的指针指向外层数据：内层退出时指针随作用域销毁（解除链接），外层数据不受影响、继续存活。",
    steps: [
      { label: "创建树 t（外层拥有所有权）", act: { t: "createData", kind: "tree", name: "t" } },
      { label: "进入子作用域", act: { t: "enterScope" } },
      { label: "在子作用域创建 ref 指针 inner → t", act: { t: "createPtr", dataRef: "t", kind: "ref", name: "inner" } },
      { label: "退出子作用域 → inner 随作用域销毁，t 活着", act: { t: "exitScope" } },
      { label: "外层再创建新指针仍可用 → t 未被销毁", act: { t: "createPtr", dataRef: "t", kind: "ref", name: "outer" } },
    ],
  },
];

let currentScenario = -1;
let stepCursor = 0;

/* 把场景步骤里的名字引用解析为实际 ID（避免硬编码脆弱） */
function resolveAct(act) {
  const a = { ...act };
  if (a.dataRef !== undefined) {
    const d = Object.values(state.datas).find(d => d.name === a.dataRef);
    if (!d) { log(state, "⛔ 找不到数据 " + a.dataRef, "warn"); return null; }
    a.dataId = d.id; delete a.dataRef;
  }
  if (a.varRef !== undefined) {
    const v = Object.values(state.vars).find(v => v.name === a.varRef);
    if (!v) { log(state, "⛔ 找不到变量 " + a.varRef, "warn"); return null; }
    a.varId = v.id; delete a.varRef;
  }
  if (a.ptrRef !== undefined) {
    const p = Object.values(state.ptrs).find(p => p.name === a.ptrRef);
    if (!p) { log(state, "⛔ 找不到指针 " + a.ptrRef, "warn"); return null; }
    a.ptrId = p.id; delete a.ptrRef;
  }
  return a;
}

function renderTabs() {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  SCENARIOS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === currentScenario ? " active" : "");
    b.textContent = s.title;
    b.addEventListener("click", () => startScenario(i));
    wrap.appendChild(b);
  });
}

function startScenario(i) {
  currentScenario = i;
  stepCursor = 0;
  state = createState();
  const s = SCENARIOS[i];
  document.getElementById("scenario-desc").textContent = s.desc;
  renderTabs(); renderStep(); render();
}

function renderStep() {
  const s = SCENARIOS[currentScenario];
  const line = document.getElementById("scenario-step");
  if (!s) { line.innerHTML = ""; return; }
  line.innerHTML = s.steps.map((st, i) =>
    `<div class="step-line"><span class="${i < stepCursor ? "done" : "pending"}">${i + 1}. ${st.label}</span></div>`
  ).join("");
  document.getElementById("next-step").disabled = stepCursor >= s.steps.length;
}

function doScenarioStep() {
  const s = SCENARIOS[currentScenario];
  if (!s || stepCursor >= s.steps.length) return;
  const a = resolveAct(s.steps[stepCursor].act);
  if (a) step(state, a);
  stepCursor++;
  render(); renderStep();
}

document.getElementById("next-step").addEventListener("click", doScenarioStep);

document.getElementById("reset-scenario").addEventListener("click", () => {
  if (currentScenario >= 0) startScenario(currentScenario);
});

renderTabs();
render();
</script>
</body>
</html>
