<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H 原型 #2 · 字节化往返模拟器（可丢弃）</title>
<style>
  :root {
    --accent: #2f6fed; --bg: #f7f8fa; --card: #fff; --line: #e3e6eb;
    --ok: #1a9e5c; --warn: #d64545; --muted: #7a8494;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: #1c2430; padding: 24px; line-height: 1.55; }
  header { max-width: 940px; margin: 0 auto 18px; }
  h1 { font-size: 22px; }
  header p { color: var(--muted); margin-top: 6px; font-size: 14px; }
  main { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  section h2 { font-size: 15px; margin-bottom: 10px; color: #33404f; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .items { display: flex; flex-wrap: wrap; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 170px; background: #fbfcfe; }
  .item.dead { opacity: .45; }
  .item .name { font-weight: 600; }
  .item .kind { font-size: 11px; color: var(--muted); }
  .fld { margin-top: 3px; font-size: 11px; }
  .fld .refname { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  .fld .shared { color: var(--warn); font-weight: 600; }
  button { font: inherit; font-size: 12px; cursor: pointer; border: 1px solid #c9d2dd; background: #fff; color: #24303d; border-radius: 6px; padding: 2px 9px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #2558c4; color: #fff; }
  button.danger { color: var(--warn); border-color: #eec4c4; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btns { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  select { font: inherit; font-size: 12px; border: 1px solid #c9d2dd; border-radius: 6px; padding: 2px 6px; }
  .bytebox { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #0f1722; color: #9fd0ff; border-radius: 8px; padding: 10px; word-break: break-all; max-height: 160px; overflow-y: auto; }
  .bytebox .hl { color: #ffd479; }
  .bytebox .lbl { color: #6ee7a0; }
  .ok-msg { color: var(--ok); font-size: 12px; margin-top: 6px; }
  .warn-msg { color: var(--warn); font-size: 12px; margin-top: 6px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: #44505e; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scenario-desc { font-size: 13px; color: #44505e; background: #f4f6f9; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .step-line { font-size: 13px; margin-top: 7px; color: var(--muted); }
  .step-line .done { color: var(--ok); }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-height: 180px; overflow-y: auto; }
  #log div { padding: 3px 0; border-bottom: 1px dashed #eef1f5; }
  #log .warn { color: var(--warn); } #log .ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>H 原型 #2 · 字节化往返模拟器</h1>
  <p>验证的核心问题：<b>一切皆字节</b>——块 = 平凡 memcpy；树 = 序列化压平（递归嵌套 + 类型标签，自描述、可逆）。重点推三个边界：深层嵌套、<b>循环引用</b>、<b>共享引用</b>。按当前设计（递归嵌套），后两个会发生什么？这正是要看的。</p>
</header>

<main>
  <section>
    <h2>① 数据世界（原始）</h2>
    <div class="btns" style="margin-bottom:8px">
      <select id="add-type">
        <option value="Point">Point（块）</option>
        <option value="Order">Order（块 + 动态块）</option>
        <option value="Account">Account（树，含 ref）</option>
        <option value="Person">Person（树）</option>
      </select>
      <button id="add-node" class="primary">添加节点</button>
      <button id="set-ref">把 Account 的 next 指向…</button>
      <select id="set-ref-src"></select>
      <button id="link-ref" class="primary">连接</button>
    </div>
    <div id="world" class="items"></div>
  </section>

  <div class="cols">
    <section>
      <h2>② 序列化（to_bytes）</h2>
      <div class="btns" style="margin-bottom:8px">
        从根 <select id="root-sel"></select> 开始
        <button id="do-serialize" class="primary">序列化</button>
      </div>
      <div id="bytes-view" class="bytebox">（尚未序列化）</div>
      <div id="bytes-notes"></div>
    </section>
    <section>
      <h2>③ 反序列化（from_bytes）</h2>
      <button id="do-deserialize" class="primary">反序列化字节 → 恢复世界</button>
      <div id="decoded-view" class="items" style="margin-top:8px"></div>
      <div id="roundtrip-notes"></div>
    </section>
  </div>

  <section>
    <h2>引导场景</h2>
    <div class="tabs" id="tabs"></div>
    <div class="scenario-desc" id="scenario-desc"></div>
    <div id="scenario-step"></div>
    <button class="primary" id="next-step">下一步</button>
    <button id="reset-scenario">重置场景</button>
  </section>

  <section>
    <h2>操作日志</h2>
    <div id="log"></div>
  </section>
</main>

<script>
/* ============================================================
 * 纯逻辑模块 —— 可移植（模拟 H 语言的字节化）
 * 不引用 DOM。
 * ============================================================ */

const TYPES = {
  Point:   { kind: "block", fields: { x: "int", y: "int" } },
  Order:   { kind: "block", fields: { id: "int", amount: "int", items: "arr<str>" } },
  Account: { kind: "tree",  fields: { balance: "int", next: "ref<Account>", owner: "val<Person>" } },
  Person:  { kind: "tree",  fields: { name: "str" } },
};
const DEF = { int: 0, str: "", "arr<str>": [], ref: null, val: null };

function createState() {
  return { nextId: 1, nodes: {}, roots: [], log: [] };
}
function log(s, msg, cls) { s.log.push({ msg, cls: cls || "" }); }
function newNode(s, type) {
  const t = TYPES[type];
  const fields = {};
  for (const [k, ft] of Object.entries(t.fields)) {
    fields[k] = ft === "int" ? 0 : ft === "str" ? "" : ft === "arr<str>" ? [] : null;
  }
  const id = s.nextId++;
  const n = { id, type, kind: t.kind, fields, alive: true, name: type + "#" + id };
  s.nodes[id] = n;
  log(s, "📦 创建 " + n.name + "（" + (t.kind === "block" ? "块" : "树") + "）", "ok");
  return n;
}

/* ---- 字节编码：自描述格式（递归嵌套 + 类型标签） ---- */
// 标记字节：0x20 块 / 0x21 树 / 0x10 int / 0x11 str / 0x12 arr / 0x13 val(嵌入块) / 0x14 ref(树引用)
function pushStr(out, s) {
  const b = new TextEncoder().encode(s);
  out.push(0x11, b.length);
  for (const x of b) out.push(x);
}
function encodeValue(s, v, stack, out) {
  if (typeof v === "number") { out.push(0x10); pushVarint(out, v); }
  else if (typeof v === "string") { pushStr(out, v); }
  else if (Array.isArray(v)) { out.push(0x12, v.length); v.forEach(x => pushStr(out, x)); }
  else if (v !== null && typeof v === "object" && v.nodeId) { encodeRef(s, v.nodeId, stack, out); }
  else { out.push(0x15); }   // null（未设置）——显式编码，保持字段边界完整
}
function encodeRef(s, targetId, stack, out) {
  if (stack.includes(targetId)) {
    throw { cycle: true, nodeId: targetId, stack: stack.slice() };
  }
  const target = s.nodes[targetId];
  out.push(target.kind === "block" ? 0x13 : 0x14);
  encodeNode(s, targetId, stack, out);
}
function encodeNode(s, id, stack, out) {
  const n = s.nodes[id];
  out.push(n.kind === "block" ? 0x20 : 0x21);
  pushStr(out, n.type);
  pushVarint(out, Object.keys(n.fields).length);   // 字段计数：解码边界
  for (const [k, v] of Object.entries(n.fields)) {
    pushStr(out, k);
    encodeValue(s, v, stack.concat(id), out);
  }
}
function pushVarint(out, n) {
  /* zigzag 编码：支持负数，符号位并入 */
  let v = n >= 0 ? n * 2 : -n * 2 - 1;
  const tmp = [];
  do { tmp.push(v & 0x7f); v = Math.floor(v / 128); } while (v > 0);
  out.push(tmp.length);
  tmp.forEach(x => out.push(x));
}

function serialize(s, rootId) {
  const out = [];
  try {
    encodeNode(s, rootId, [], out);
    return { ok: true, bytes: out, text: bytesToHex(out), shared: collectShared(s, rootId) };
  } catch (e) {
    if (e && e.cycle) return { ok: false, cycle: true, nodeId: e.nodeId, stack: e.stack };
    throw e;
  }
}

/* 共享检测：统计每个节点被编码的次数（图遍历，非路径栈） */
function collectShared(s, rootId) {
  const count = {};
  const walk = (id, stack) => {
    if (stack.includes(id)) return;
    count[id] = (count[id] || 0) + 1;
    const n = s.nodes[id];
    for (const v of Object.values(n.fields)) {
      if (v && typeof v === "object" && v.nodeId) walk(v.nodeId, stack.concat(id));
    }
  };
  walk(rootId, []);
  return Object.entries(count).filter(([, c]) => c > 1).map(([id]) => Number(id));
}

/* ---- 反序列化 ---- */
function deserialize(s, bytes) {
  let pos = 0;
  const decodeStr = () => {
    if (bytes[pos] !== 0x11) throw new Error("格式错: 期望字符串 @" + pos);
    const len = bytes[pos + 1]; pos += 2;
    const arr = bytes.slice(pos, pos + len); pos += len;
    return new TextDecoder().decode(Uint8Array.from(arr));
  };
  const decodeVarint = () => { const len = bytes[pos]; pos += 1; let v = 0, mult = 1; for (let i = 0; i < len; i++) { v += bytes[pos + i] * mult; mult *= 128; } pos += len; return (v % 2 === 1) ? -(Math.floor(v / 2) + 1) : v / 2; };
  const decodeValue = () => {
    const tag = bytes[pos++];
    if (tag === 0x10) return decodeVarint();
    if (tag === 0x11) { const len = bytes[pos]; pos += 1; const arr = bytes.slice(pos, pos + len); pos += len; return new TextDecoder().decode(Uint8Array.from(arr)); }
    if (tag === 0x12) { const n = bytes[pos++]; const items = []; for (let i = 0; i < n; i++) items.push(decodeStr()); return items; }
    if (tag === 0x13 || tag === 0x14) { const n = decodeNode(); return { nodeId: n.id }; }
    if (tag === 0x15) return null;
    throw new Error("未知标记 0x" + tag.toString(16) + " @" + (pos - 1));
  };
  const decodeNode = () => {
    const kindTag = bytes[pos++];
    if (kindTag !== 0x20 && kindTag !== 0x21) throw new Error("期望节点 @" + (pos - 1));
    const type = decodeStr();
    const count = decodeVarint();              // 字段计数：只读自己的字段
    const n = { id: s.nextId++, type, kind: kindTag === 0x20 ? "block" : "tree", fields: {}, alive: true, name: type + "@r" + (s.nextId - 1) };
    s.nodes[n.id] = n;
    for (let i = 0; i < count; i++) {
      const k = decodeStr();
      n.fields[k] = decodeValue();
    }
    return n;
  };
  const root = decodeNode();
  if (pos !== bytes.length) throw new Error("字节流尾部有残余 @" + pos);
  log(s, "🔁 反序列化完成 → 根节点 " + root.name, "ok");
  return root;
}

/* ---- 往返验证 ---- */
function toTree(s, id, seenShared) {
  const n = s.nodes[id];
  const t = { type: n.type, kind: n.kind };
  for (const [k, v] of Object.entries(n.fields)) {
    if (v && typeof v === "object" && v.nodeId) {
      t[k] = toTree(s, v.nodeId, seenShared);
      seenShared.add(v.nodeId);
    } else if (Array.isArray(v)) t[k] = { arr: v.slice() };
    else t[k] = v;
  }
  return t;
}

function bytesToHex(bytes) {
  const H = "0123456789abcdef";
  let r = "";
  for (let i = 0; i < bytes.length; i++) { r += H[bytes[i] >> 4] + H[bytes[i] & 15] + " "; }
  return r;
}
/* ============ 纯逻辑模块结束 ============ */

/* ============ 页面壳（可丢弃） ============ */
let state = createState();
let lastBytes = null;
let lastShared = [];
let decodedWorld = null;

function render() {
  renderWorld(); renderRootSel(); renderBytes(); renderDecoded(); renderLog();
}
function renderWorld() {
  const wrap = document.getElementById("world");
  wrap.innerHTML = "";
  const ns = Object.values(state.nodes);
  if (!ns.length) { wrap.innerHTML = '<span class="empty">空世界——先添加节点</span>'; return; }
  ns.forEach(n => {
    const card = document.createElement("div");
    card.className = "item" + (n.alive ? "" : " dead");
    const flds = Object.entries(n.fields).map(([k, v]) => {
      let val;
      if (v && typeof v === "object" && v.nodeId) {
        const t = state.nodes[v.nodeId];
        val = `<span class="refname">→ ${t ? t.name : "?"}</span>`;
      } else if (Array.isArray(v)) val = "[" + v.join(", ") + "]";
      else val = v;
      return `<div class="fld">${k}: ${val}</div>`;
    }).join("");
    card.innerHTML = `<div><span class="name">${n.name}</span> <span class="kind">${n.kind === "block" ? "块" : "树"}</span></div>${flds}`;
    wrap.appendChild(card);
  });
}
function renderRootSel() {
  const sel = document.getElementById("root-sel");
  const prev = sel.value;
  sel.innerHTML = Object.values(state.nodes).map(n => `<option value="${n.id}">${n.name}</option>`).join("");
  sel.value = prev || Object.keys(state.nodes)[0] || "";
  const s2 = document.getElementById("set-ref-src");
  s2.innerHTML = Object.values(state.nodes).filter(n => n.type === "Account").map(n => `<option value="${n.id}">${n.name}</option>`).join("");
}
function renderBytes() {
  const box = document.getElementById("bytes-view");
  const notes = document.getElementById("bytes-notes");
  if (!lastBytes) { box.textContent = "（尚未序列化）"; notes.innerHTML = ""; return; }
  if (lastBytes.cycle) {
    box.textContent = "⛔ 序列化失败：检测到循环引用！";
    const names = lastBytes.stack.map(id => state.nodes[id] ? state.nodes[id].name : "#" + id).join(" → ");
    notes.innerHTML = `<div class="warn-msg">⚠️ 循环引用路径：${names}<br>已决策：循环引用/自引用禁用——树的引用必须无环。序列化中止。将来如需成环数据，再考虑图编码（ID 引用）。</div>`;
    return;
  }
  box.textContent = lastBytes.text;
  let note = "";
  if (lastBytes.shared && lastBytes.shared.length) {
    const names = lastBytes.shared.map(id => state.nodes[id] ? state.nodes[id].name : "#" + id).join("、");
    note = `<div class="warn-msg">⚠️ 共享引用：${names} 被多处引用——递归嵌套格式会把它们<b>复制两份</b>，反序列化后共享关系丢失（变成独立副本）。这是设计空白。</div>`;
  } else {
    note = `<div class="ok-msg">✅ 无循环、无共享——此字节流可无损往返。</div>`;
  }
  notes.innerHTML = note;
}
function renderDecoded() {
  const wrap = document.getElementById("decoded-view");
  const notes = document.getElementById("roundtrip-notes");
  wrap.innerHTML = "";
  notes.innerHTML = "";
  if (!decodedWorld) { wrap.innerHTML = '<span class="empty">（尚未反序列化）</span>'; return; }
  Object.values(decodedWorld.nodes).forEach(n => {
    const card = document.createElement("div");
    card.className = "item";
    const flds = Object.entries(n.fields).map(([k, v]) => {
      let val;
      if (v && typeof v === "object" && v.nodeId) {
        const t = decodedWorld.nodes[v.nodeId];
        val = `<span class="refname">→ ${t ? t.name : "?"}</span>`;
      } else if (Array.isArray(v)) val = "[" + v.join(", ") + "]";
      else val = v;
      return `<div class="fld">${k}: ${val}</div>`;
    }).join("");
    card.innerHTML = `<div><span class="name">${n.name}</span> <span class="kind">${n.kind === "block" ? "块" : "树"}</span></div>${flds}`;
    wrap.appendChild(card);
  });
  // 往返比较（结构相等 + 共享丢失提示）
  if (lastBytes && lastBytes.ok) {
    const origSeen = new Set(), decSeen = new Set();
    const origTree = toTree(state, rootSelValue(), origSeen);
    const decRoot = Object.values(decodedWorld.nodes).find(n => n.name.includes("@r"));
    const decTree = toTree(decodedWorld, decRoot.id, decSeen);
    const equal = JSON.stringify(origTree) === JSON.stringify(decTree);
    notes.innerHTML = equal
      ? `<div class="ok-msg">✅ 结构往返一致</div>`
      : `<div class="warn-msg">❌ 结构不一致！</div>`;
  }
}
function rootSelValue() { return Number(document.getElementById("root-sel").value || 0); }
function renderLog() {
  const wrap = document.getElementById("log");
  wrap.innerHTML = "";
  state.log.forEach(e => {
    const div = document.createElement("div");
    div.className = e.cls;
    div.textContent = e.msg;
    wrap.appendChild(div);
  });
  wrap.scrollTop = wrap.scrollHeight;
}

document.getElementById("add-node").addEventListener("click", () => {
  const type = document.getElementById("add-type").value;
  newNode(state, type);
  render();
});
document.getElementById("link-ref").addEventListener("click", () => {
  const src = Number(document.getElementById("set-ref-src").value);
  const rootId = rootSelValue();
  const n = state.nodes[src];
  if (!n || n.type !== "Account") return;
  if (n.fields.next && n.fields.next.nodeId) { log(state, "⛔ " + n.name + " 的 next 已指向其他节点，先取消", "warn"); render(); return; }
  n.fields.next = { nodeId: rootId };
  log(state, "🔗 " + n.name + ".next → " + state.nodes[rootId].name, "ok");
  render();
});
document.getElementById("do-serialize").addEventListener("click", () => {
  const rootId = rootSelValue();
  if (!rootId) return;
  const res = serialize(state, rootId);
  lastBytes = res;
  lastShared = res.shared || [];
  decodedWorld = null;
  log(state, "🧬 序列化根 " + state.nodes[rootId].name + (res.ok ? " → " + res.bytes.length + " 字节" : " → 失败(循环)"), res.ok ? "ok" : "warn");
  render();
});
document.getElementById("do-deserialize").addEventListener("click", () => {
  if (!lastBytes || !lastBytes.ok) { log(state, "⛔ 没有可用的字节流", "warn"); return; }
  decodedWorld = createState();
  const root = deserialize(decodedWorld, lastBytes.bytes);
  decodedWorld.rootId = root.id;
  log(state, "🔁 反序列化 → " + Object.keys(decodedWorld.nodes).length + " 个节点", "ok");
  render();
});

/* ---------- 引导场景 ---------- */
const SCENARIOS = [
  {
    title: "块 = memcpy",
    desc: "块数据（Point）的字节化是平凡的：序列化压平 + 反序列化恢复，无引用、无歧义。看字节流里只出现 int 和类型标签。",
    steps: [
      { label: "创建块 Point", act: () => { const n = newNode(state, "Point"); n.fields.x = 10; n.fields.y = 20; } },
      { label: "序列化 Point（从根选择它）", act: () => { const rootId = Object.values(state.nodes).find(n => n.type === "Point").id; const r = serialize(state, rootId); lastBytes = r; lastShared = []; decodedWorld = null; document.getElementById("root-sel").value = rootId; } },
      { label: "反序列化 → 恢复同构 Point", act: () => { decodedWorld = createState(); deserialize(decodedWorld, lastBytes.bytes); } },
    ],
  },
  {
    title: "简单树（引用恢复）",
    desc: "树数据（Account）+ 引用字段（owner → Person）。序列化把 Person 递归展开进字节流；反序列化后引用关系恢复（Account 仍指向它的 Person）。",
    steps: [
      { label: "创建树 Account 与 Person", act: () => { newNode(state, "Account"); const p = newNode(state, "Person"); p.fields.name = "汉克"; } },
      { label: "把 Account.owner 指向 Person", act: () => { const a = Object.values(state.nodes).find(n => n.type === "Account"); const p = Object.values(state.nodes).find(n => n.type === "Person"); a.fields.owner = { nodeId: p.id }; } },
      { label: "序列化 Account", act: () => { const a = Object.values(state.nodes).find(n => n.type === "Account"); document.getElementById("root-sel").value = a.id; const r = serialize(state, a.id); lastBytes = r; lastShared = []; decodedWorld = null; } },
      { label: "反序列化 → 引用关系恢复", act: () => { decodedWorld = createState(); deserialize(decodedWorld, lastBytes.bytes); } },
    ],
  },
  {
    title: "深层嵌套树",
    desc: "三层的链式引用 Account → Account → Account。递归嵌套格式深度展开，往返后结构一致。",
    steps: [
      { label: "创建三个 Account，链式连接", act: () => {
        const a = newNode(state, "Account"), b = newNode(state, "Account"), c = newNode(state, "Account");
        a.fields.next = { nodeId: b.id }; b.fields.next = { nodeId: c.id };
      } },
      { label: "序列化（根 = 第一个 Account）", act: () => { const a = Object.values(state.nodes).find(n => n.type === "Account"); document.getElementById("root-sel").value = a.id; const r = serialize(state, a.id); lastBytes = r; lastShared = []; decodedWorld = null; } },
      { label: "反序列化 → 三层结构完整恢复", act: () => { decodedWorld = createState(); deserialize(decodedWorld, lastBytes.bytes); } },
    ],
  },
  {
    title: "循环引用（已决策：禁用）",
    desc: "Account.next 指向自己——环形。递归嵌套格式会无限展开。已拍板：循环引用/自引用一律禁用——序列化时检测到环即报错中止。'树'必须无环。",
    steps: [
      { label: "创建一个 Account", act: () => newNode(state, "Account") },
      { label: "让 Account.next 指向自己（自环）", act: () => { const a = Object.values(state.nodes).find(n => n.type === "Account"); a.fields.next = { nodeId: a.id }; } },
      { label: "尝试序列化 → 检测到循环引用，中止并报错", act: () => { const a = Object.values(state.nodes).find(n => n.type === "Account"); document.getElementById("root-sel").value = a.id; const r = serialize(state, a.id); lastBytes = r; decodedWorld = null; } },
      { label: "看提示：环被拒绝（已决策）——将来如需成环数据，再考虑图编码", act: () => {} },
    ],
  },
  {
    title: "共享引用（设计空白）",
    desc: "从根 Account 出发有两条路径指向同一个 Person（owner 直接指向，next 的 owner 也指向它）。递归嵌套格式把 Person 编码两次——反序列化后是两个独立副本，共享关系丢失。",
    steps: [
      { label: "创建两个 Account 和一个 Person", act: () => { const a1 = newNode(state, "Account"); const a2 = newNode(state, "Account"); const p = newNode(state, "Person"); p.fields.name = "共享的人"; } },
      { label: "a1.next → a2；a1.owner → Person；a2.owner → Person（两条路径共享）", act: () => {
        const [a1, a2] = Object.values(state.nodes).filter(n => n.type === "Account");
        const p = Object.values(state.nodes).find(n => n.type === "Person");
        a1.fields.next = { nodeId: a2.id };
        a1.fields.owner = { nodeId: p.id };
        a2.fields.owner = { nodeId: p.id };
      } },
      { label: "序列化（根 = 第一个 Account）", act: () => { const a = Object.values(state.nodes).filter(n => n.type === "Account")[0]; document.getElementById("root-sel").value = a.id; const r = serialize(state, a.id); lastBytes = r; lastShared = r.shared || []; decodedWorld = null; } },
      { label: "反序列化 → 观察共享丢失警告", act: () => { decodedWorld = createState(); deserialize(decodedWorld, lastBytes.bytes); } },
    ],
  },
];

let currentScenario = -1;
let stepCursor = 0;
function renderTabs() {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  SCENARIOS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === currentScenario ? " active" : "");
    b.textContent = s.title;
    b.addEventListener("click", () => startScenario(i));
    wrap.appendChild(b);
  });
}
function startScenario(i) {
  currentScenario = i; stepCursor = 0;
  state = createState(); lastBytes = null; lastShared = []; decodedWorld = null;
  document.getElementById("scenario-desc").textContent = SCENARIOS[i].desc;
  renderTabs(); renderStep(); render();
}
function renderStep() {
  const s = SCENARIOS[currentScenario];
  const line = document.getElementById("scenario-step");
  if (!s) { line.innerHTML = ""; return; }
  line.innerHTML = s.steps.map((st, i) =>
    `<div class="step-line"><span class="${i < stepCursor ? "done" : "pending"}">${i + 1}. ${st.label}</span></div>`).join("");
  document.getElementById("next-step").disabled = stepCursor >= s.steps.length;
}
document.getElementById("next-step").addEventListener("click", () => {
  const s = SCENARIOS[currentScenario];
  if (!s || stepCursor >= s.steps.length) return;
  s.steps[stepCursor].act();
  stepCursor++;
  render(); renderStep();
});
document.getElementById("reset-scenario").addEventListener("click", () => { if (currentScenario >= 0) startScenario(currentScenario); });

renderTabs();
render();
</script>
</body>
</html>
