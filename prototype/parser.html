<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H 原型 #3 · 解析器（可丢弃）</title>
<style>
  :root { --accent:#2f6fed; --bg:#f7f8fa; --card:#fff; --line:#e3e6eb; --ok:#1a9e5c; --warn:#d64545; --muted:#7a8494; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1c2430; padding:24px; line-height:1.55; }
  header { max-width:1100px; margin:0 auto 16px; }
  h1 { font-size:22px; }
  header p { color:var(--muted); margin-top:6px; font-size:14px; }
  main { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  section h2 { font-size:15px; margin-bottom:10px; color:#33404f; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px){ .cols{grid-template-columns:1fr;} }
  textarea { width:100%; height:320px; font-family:ui-monospace,Consolas,monospace; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; background:#fbfcfe; }
  button { font:inherit; font-size:13px; cursor:pointer; border:1px solid #c9d2dd; background:#fff; color:#24303d; border-radius:6px; padding:4px 14px; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#2558c4; color:#fff; }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  .toolbar .hint { font-size:12px; color:var(--muted); }
  .tokens { display:flex; flex-wrap:wrap; gap:4px; font-family:ui-monospace,Consolas,monospace; font-size:11px; max-height:180px; overflow-y:auto; }
  .tok { border:1px solid var(--line); border-radius:4px; padding:1px 6px; background:#f4f6f9; }
  .tok.kw { background:#e8f3ff; color:#1b5fc4; }
  .tok.num { color:#b26a00; } .tok.str { color:#1a9e5c; } .tok.nl { opacity:.4; }
  .tok.err { background:#fde8e8; color:var(--warn); font-weight:600; }
  .ast { font-size:12px; max-height:420px; overflow-y:auto; padding:8px; background:#fbfcfe; border:1px solid var(--line); border-radius:8px; }
  .ast ul { list-style:none; padding-left:16px; border-left:1px dashed #dde3ea; margin-left:6px; }
  .ast li { padding:1px 0; }
  .ast .node { color:#1b5fc4; font-weight:600; }
  .ast .fld { color:#44505e; }
  .ast .val { color:#b26a00; }
  .ast .stx { color:#d64545; font-weight:600; }
  .banner { font-size:13px; border-radius:8px; padding:10px 14px; display:none; }
  .banner.show { display:block; }
  .banner.ok { background:#e7f6ee; color:var(--ok); }
  .banner.err { background:#fde8e8; color:var(--warn); }
  .banner code { font-family:ui-monospace,Consolas,monospace; }
</style>
</head>
<body>

<header>
  <h1>H 原型 #3 · 词法器 + 解析器</h1>
  <p>验证语法草案可解析。左侧源码（默认是完整示例程序），点"解析"查看 token 流与 AST 树；语法设计的试金石是错误报告——改错一个符号，看提示是否指向正确位置。</p>
</header>

<main>
  <section>
    <h2>源码</h2>
    <div class="toolbar">
      <button class="primary" id="parse-btn">解析</button>
      <button id="reset-btn">恢复示例</button>
      <span class="hint">支持：struct/class/enum/interface/fun/global/spawn/import/hide/alias/mut/ref/move/error/yield</span>
    </div>
    <textarea id="src" spellcheck="false"></textarea>
  </section>

  <div class="banner" id="banner"></div>

  <div class="cols">
    <section>
      <h2>Token 流</h2>
      <div class="tokens" id="tokens"></div>
    </section>
    <section>
      <h2>AST</h2>
      <div class="ast" id="ast"></div>
    </section>
  </div>
</main>

<script>
/* ============================================================
 * 纯逻辑模块 —— 词法器 + 解析器（可移植）
 * 不引用 DOM。
 * ============================================================ */

function lex(src) {
  const toks = [];
  let i = 0, line = 1, col = 1;
  const KW = new Set(["struct","class","enum","interface","fun","mut","ref","move","error","return","if","else","global","spawn","import","hide","alias","use","pub","yield","match","try","catch"]);
  const OPS = ["->","+=","-=","*=","/=","==","!=","<=",">=","&&","||","::","=","<",">","+","-","*","/","%","!","{","}","(",")","[","]",";",",",":",".","?"];
  const push = (kind, value, ln, cl) => toks.push({ kind, value, line: ln, col: cl });
  while (i < src.length) {
    const c = src[i];
    if (c === "\n") { push("NEWLINE", "\n", line, col); line++; col = 1; i++; continue; }
    if (c === " " || c === "\t" || c === "\r") { col++; i++; continue; }
    if (c === "/" && src[i+1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (c === '"') {
      let s = "", j = i + 1;
      while (j < src.length && src[j] !== '"') { s += src[j]; j++; }
      push("STRING", s, line, col); col += (j - i) + 1; i = j + 1; continue;
    }
    if (/\d/.test(c)) {
      let s = "";
      while (i < src.length && /[\d.]/.test(src[i])) s += src[i++];
      push("NUMBER", parseFloat(s), line, col); col += s.length; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let s = "";
      while (i < src.length && /[A-Za-z0-9_]/.test(src[i])) s += src[i++];
      push(KW.has(s) ? "KEYWORD" : "IDENT", s, line, col); col += s.length; continue;
    }
    let matched = null;
    for (const op of OPS) { if (src.startsWith(op, i)) { matched = op; break; } }
    if (matched) { push("OP", matched, line, col); i += matched.length; col += matched.length; continue; }
    throw { lex: true, msg: "无法识别的字符 '" + c + "'", line, col };
  }
  push("EOF", "", line, col);
  return toks;
}

class Parser {
  constructor(toks) { this.t = toks; this.p = 0; }
  peek(off) { return this.t[Math.min(this.p + (off || 0), this.t.length - 1)]; }
  next() { return this.t[this.p++]; }
  skipNL() { while (this.peek().kind === "NEWLINE") this.p++; }
  check(kind, value) { const tk = this.peek(); return tk.kind === kind && (value === undefined || tk.value === value); }
  match(kind, value) { if (this.check(kind, value)) { this.p++; return true; } return false; }
  expect(kind, value, what) {
    const tk = this.peek();
    if (tk.kind === kind && (value === undefined || tk.value === value)) { this.p++; return tk; }
    throw { parse: true, msg: "期望 " + (what || (value !== undefined ? "'" + value + "'" : kind)) + "，但遇到 '" + (tk.value || tk.kind) + "'", line: tk.line, col: tk.col };
  }
  err(msg, tk) { throw { parse: true, msg, line: tk.line, col: tk.col }; }

  /* ---- 顶层 ---- */
  parseProgram() {
    const decls = [];
    while (true) {
      this.skipNL();
      if (this.check("EOF")) break;
      decls.push(this.parseTopLevel());
    }
    return { type: "Program", decls };
  }
  parseTopLevel() {
    if (this.match("KEYWORD", "struct")) return this.parseStruct();
    if (this.match("KEYWORD", "class")) return this.parseClass();
    if (this.match("KEYWORD", "enum")) return this.parseEnum();
    if (this.match("KEYWORD", "interface")) return this.parseInterface();
    if (this.match("KEYWORD", "fun")) return this.parseFun(true);
    if (this.match("KEYWORD", "global")) return this.parseGlobal();
    if (this.match("KEYWORD", "spawn")) { const e = this.parseExpr(); this.optSemi(); return { type: "SpawnStmt", callee: e }; }
    return this.parseStmt();
  }

  parseStruct() {
    const name = this.expect("IDENT", undefined, "结构体名").value;
    this.expect("OP", "{");
    const fields = [];
    while (true) {
      this.skipNL();
      if (this.match("OP", "}")) break;
      fields.push(this.parseField());
      this.fieldSep();
    }
    return { type: "StructDecl", name, fields };
  }
  parseField() {
    let isMut = false;
    if (this.match("KEYWORD", "mut")) isMut = true;
    const name = this.expect("IDENT", undefined, "字段名").value;
    this.expect("OP", ":", "':'");
    const type = this.parseType();
    return { type: "FieldDecl", name, type, isMut };
  }
  fieldSep() {
    if (this.match("OP", ";") || this.match("OP", ",")) { return; }
    if (this.peek().kind === "NEWLINE") { this.skipNL(); return; }
    if (this.peek().value === "}") return;
    const tk = this.peek();
    this.err("期望字段分隔（换行/分号）或 '}'，但遇到 '" + (tk.value || tk.kind) + "'", tk);
  }

  parseClass() {
    const name = this.expect("IDENT", undefined, "类名").value;
    const interfaces = [];
    if (this.match("OP", ":")) {
      do { interfaces.push(this.expect("IDENT", undefined, "接口名").value); } while (this.match("OP", ","));
    }
    this.expect("OP", "{");
    const imports = [], hides = [], aliases = [], fields = [], methods = [];
    while (true) {
      this.skipNL();
      if (this.match("OP", "}")) break;
      if (this.match("KEYWORD", "import")) { imports.push({ type: "ImportSpec", name: this.expect("IDENT", undefined, "类名").value }); continue; }
      if (this.match("KEYWORD", "hide")) { hides.push({ type: "HideSpec", path: this.parsePath() }); continue; }
      if (this.match("KEYWORD", "alias")) {
        const alias = this.expect("IDENT", undefined, "别名").value;
        this.expect("OP", "=", "'='");
        aliases.push({ type: "AliasSpec", alias, path: this.parsePath() });
        continue;
      }
      if (this.peek().kind === "KEYWORD" && this.peek().value === "fun") { this.next(); methods.push(this.parseFun(false)); continue; }
      fields.push(this.parseField());
      this.fieldSep();
    }
    return { type: "ClassDecl", name, interfaces, imports, hides, aliases, fields, methods };
  }
  parsePath() {
    const parts = [this.expect("IDENT", undefined, "名称").value];
    while (this.match("OP", "::")) parts.push(this.expect("IDENT", undefined, "名称").value);
    return { type: "Path", parts };
  }

  parseEnum() {
    const name = this.expect("IDENT", undefined, "枚举名").value;
    this.expect("OP", "{");
    const variants = [];
    this.skipNL();
    if (!this.check("OP", "}")) {
      do { variants.push(this.expect("IDENT", undefined, "变体名").value); this.skipNL(); } while (this.match("OP", ",") || this.match("NEWLINE"));
    }
    this.expect("OP", "}");
    return { type: "EnumDecl", name, variants };
  }

  parseInterface() {
    const name = this.expect("IDENT", undefined, "接口名").value;
    this.expect("OP", "{");
    const methods = [];
    while (true) {
      this.skipNL();
      if (this.match("OP", "}")) break;
      if (this.match("KEYWORD", "fun")) methods.push(this.parseFunSig());
      else { const tk = this.peek(); this.err("接口体内只允许 fun 签名，但遇到 '" + (tk.value || tk.kind) + "'", tk); }
    }
    return { type: "InterfaceDecl", name, methods };
  }
  parseFunSig() {
    const name = this.expect("IDENT", undefined, "函数名").value;
    const params = this.parseParams();
    const ret = this.peek().value === "->" ? this.parseRet() : null;
    return { type: "FunSig", name, params, ret };
  }

  parseFun(isTop) {
    const name = this.expect("IDENT", undefined, "函数名").value;
    const params = this.parseParams();
    const ret = this.peek().value === "->" ? this.parseRet() : null;
    const body = this.parseBlock();
    return { type: "FunDecl", name, params, ret, body, isTop: !!isTop };
  }
  parseParams() {
    this.expect("OP", "(");
    const params = [];
    this.skipNL();
    if (!this.check("OP", ")")) {
      do {
        this.skipNL();
        const pname = this.expect("IDENT", undefined, "参数名").value;
        this.expect("OP", ":");
        let kind = "val";
        if (this.match("KEYWORD", "ref")) kind = "ref";
        else if (this.match("KEYWORD", "move")) kind = "move";
        params.push({ type: "Param", name: pname, kind, type: this.parseType() });
        this.skipNL();
      } while (this.match("OP", ","));
    }
    this.expect("OP", ")");
    return params;
  }
  parseRet() {
    this.expect("OP", "->", "'->'");
    let kind = "val";
    if (this.match("KEYWORD", "error")) kind = "error";
    else if (this.match("KEYWORD", "move")) kind = "move";
    else if (this.match("KEYWORD", "ref")) kind = "ref";
    const type = this.parseType();
    return { type: "RetType", kind, type };
  }

  parseGlobal() {
    const name = this.expect("IDENT", undefined, "全局名").value;
    this.expect("OP", ":");
    const type = this.parseType();
    let init = null;
    if (this.match("OP", "=")) init = this.parseExpr();
    this.optSemi();
    return { type: "GlobalDecl", name, type, init };
  }

  /* ---- 类型 ---- */
  parseType() {
    if (this.check("OP", "[")) {
      this.next();
      const elem = this.parseType();
      this.expect("OP", "]", "']'");
      return { type: "ArrayType", elem };
    }
    let mutable = false;
    if (this.match("KEYWORD", "ref")) mutable = true;
    const name = this.expect("IDENT", undefined, "类型名").value;
    if (this.match("OP", "<")) {
      const args = [];
      do { args.push(this.parseType()); } while (this.match("OP", ","));
      this.expect("OP", ">", "'>'");
      return { type: "GenericType", name, args, mutable };
    }
    return { type: "NamedType", name, mutable };
  }

  /* ---- 语句 ---- */
  parseBlock() {
    this.expect("OP", "{", "'{'");
    const stmts = [];
    while (true) {
      this.skipNL();
      if (this.match("OP", "}")) break;
      if (this.check("EOF")) this.err("块未闭合（缺少 '}'）", this.peek());
      stmts.push(this.parseStmt());
    }
    return { type: "Block", stmts };
  }
  optSemi() { this.match("OP", ";"); this.skipNL(); }

  parseStmt() {
    if (this.match("KEYWORD", "return")) {
      let expr = null;
      if (!this.check("OP", ";") && !this.check("OP", "}") && this.peek().kind !== "NEWLINE") expr = this.parseExpr();
      this.optSemi();
      return { type: "ReturnStmt", expr };
    }
    if (this.match("KEYWORD", "yield")) { this.optSemi(); return { type: "YieldStmt" }; }
    if (this.match("KEYWORD", "spawn")) {
      const callee = this.parseExpr();
      this.optSemi();
      return { type: "SpawnStmt", callee };
    }
    if (this.check("KEYWORD", "if")) {
      this.next();
      const cond = this.parseExpr();
      const then = this.parseBlock();
      let els = null;
      this.skipNL();
      if (this.match("KEYWORD", "else")) {
        if (this.check("KEYWORD", "if")) els = this.parseStmt();
        else els = this.parseBlock();
      }
      return { type: "IfStmt", cond, then, els };
    }
    if (this.match("OP", "{")) { this.p--; return this.parseBlock(); }
    if (this.match("KEYWORD", "mut") || this.match("KEYWORD", "ref")) {
      const kind = this.t[this.p - 1].value;
      return this.parseVarDecl(kind);
    }
    // 无关键字的声明（bytes = ...）或表达式语句
    if (this.check("IDENT")) {
      const save = this.p;
      const id = this.next();
      this.skipNL();
      if (this.match("OP", "=")) {
        const init = this.parseExpr();
        this.optSemi();
        return { type: "VarDecl", name: id.value, kind: "val", type: null, init };
      }
      this.p = save;
    }
    const e = this.parseExpr();
    this.optSemi();
    return { type: "ExprStmt", expr: e };
  }
  parseVarDecl(kind) {
    const name = this.expect("IDENT", undefined, "变量名").value;
    let type = null;
    if (this.match("OP", ":")) type = this.parseType();
    let init = null;
    if (this.match("OP", "=")) init = this.parseExpr();
    this.optSemi();
    return { type: "VarDecl", name, kind, type, init };
  }

  /* ---- 表达式（优先级爬升） ---- */
  parseExpr() { return this.parseAssign(); }
  parseAssign() {
    const left = this.parseBinary(1);
    if (this.check("OP", "=") || this.check("OP", "+=") || this.check("OP", "-=") || this.check("OP", "*=") || this.check("OP", "/=")) {
      const op = this.next().value;
      const right = this.parseAssign();
      return { type: "AssignExpr", op, left, right };
    }
    return left;
  }
  parseBinary(minPrec) {
    const PREC = { "||":1, "&&":2, "==":3, "!=":3, "<":4, "<=":4, ">":4, ">=":4, "+":5, "-":5, "*":6, "/":6, "%":6 };
    let left = this.parseUnary();
    while (true) {
      const tk = this.peek();
      if (tk.kind !== "OP") break;
      const prec = PREC[tk.value];
      if (prec === undefined || prec < minPrec) break;
      this.next();
      const right = this.parseBinary(prec + 1);
      left = { type: "BinExpr", op: tk.value, left, right };
    }
    return left;
  }
  parseUnary() {
    if (this.check("OP", "!") || this.check("OP", "-")) {
      const op = this.next().value;
      return { type: "UnaryExpr", op, operand: this.parseUnary() };
    }
    if (this.match("KEYWORD", "move")) {
      return { type: "MoveExpr", expr: this.parseUnary() };
    }
    return this.parsePostfix();
  }
  parsePostfix() {
    let e = this.parsePrimary();
    while (true) {
      if (this.match("OP", ".")) {
        const prop = this.expect("IDENT", undefined, "属性名").value;
        e = { type: "MemberExpr", obj: e, prop };
      } else if (this.check("OP", "(")) {
        const args = this.parseArgs();
        e = { type: "CallExpr", callee: e, args };
      } else if (this.check("OP", "[")) {
        this.next();
        const idx = this.parseExpr();
        this.expect("OP", "]", "']'");
        e = { type: "IndexExpr", obj: e, index: idx };
      } else break;
    }
    return e;
  }
  parseArgs() {
    this.expect("OP", "(");
    const args = [];
    this.skipNL();
    if (!this.check("OP", ")")) {
      do { this.skipNL(); args.push(this.parseExpr()); this.skipNL(); } while (this.match("OP", ","));
    }
    this.expect("OP", ")");
    return args;
  }
  parsePrimary() {
    const tk = this.peek();
    if (tk.kind === "NUMBER") { this.next(); return { type: "Literal", kind: "number", value: tk.value }; }
    if (tk.kind === "STRING") { this.next(); return { type: "Literal", kind: "string", value: tk.value }; }
    if (tk.kind === "KEYWORD" && (tk.value === "true" || tk.value === "false")) { this.next(); return { type: "Literal", kind: "bool", value: tk.value === "true" }; }
    if (tk.kind === "KEYWORD" && tk.value === "error") {
      this.next();
      this.expect("OP", ".", "'.'");
      return { type: "ErrorLit", name: this.expect("IDENT", undefined, "错误名").value };
    }
    if (this.check("OP", "(")) {
      this.next();
      const e = this.parseExpr();
      this.expect("OP", ")", "')'");
      return e;
    }
    if (this.check("OP", "[")) {
      this.next();
      const items = [];
      this.skipNL();
      if (!this.check("OP", "]")) {
        do { this.skipNL(); items.push(this.parseExpr()); this.skipNL(); } while (this.match("OP", ","));
      }
      this.expect("OP", "]", "']'");
      return { type: "ArrayLiteral", items };
    }
    if (tk.kind === "IDENT") {
      this.next();
      // 构造字面量 Account{ balance: initial }
      if (this.check("OP", "{")) {
        this.next();
        const fields = [];
        this.skipNL();
        if (!this.check("OP", "}")) {
          do {
            this.skipNL();
            const fname = this.expect("IDENT", undefined, "字段名").value;
            this.expect("OP", ":");
            const fexpr = this.parseExpr();
            fields.push({ name: fname, expr: fexpr });
            this.skipNL();
          } while (this.match("OP", ","));
        }
        this.expect("OP", "}", "'}'");
        return { type: "ConstructExpr", name: tk.value, fields };
      }
      return { type: "Ident", name: tk.value };
    }
    this.err("期望表达式，但遇到 '" + (tk.value || tk.kind) + "'", tk);
  }
}
function parse(src) {
  const toks = lex(src);
  return new Parser(toks).parseProgram();
}
/* ============ 纯逻辑模块结束 ============ */

/* ============ 页面壳（可丢弃） ============ */
const DEFAULT_SRC = `// 命名空间 = 文件路径（orders/billing.h → orders.billing）

// 块（连续内存，复制语义）
struct Order {
    id: u64
    amount: f64
    items: [Str]
}

// 枚举（块的一种，穷尽 match）
enum OrderStatus { Pending, Paid, Refunded }

// 接口（纯静态契约）
interface Payable {
    fun amount() -> f64
}

// class = 树（值字段 + 引用字段 + 方法集）
class Account : Payable {
    mut balance: f64
    orders: [Order]
    next: ref Account

    fun amount() -> f64 {
        return balance
    }
}

// 函数契约
fun process(order: Order, account: ref Account) -> error bool {
    if order.amount > account.balance {
        return error.InsufficientFunds
    }
    account.balance -= order.amount
    return true
}

fun describe(acc: Account) -> Str {
    return "balance=" + acc.balance.to_str()
}

fun build_account(initial: f64) -> move Account {
    mut acc = Account{ balance: initial }
    return move acc
}

// 作用域 / 字节化 / move
fun demo() -> error void {
    mut acc = build_account(1000.0)
    {
        ref view = acc
        view.balance += 50
    }
    bytes = acc.to_bytes()
    restored = Account.from_bytes(bytes)
    store("account.bin", bytes)
    other = move acc
}

// 并发
global ledger: Exclusive<[Str]> = []

fun worker() {
    yield
}

spawn worker()
`;

const SRC = document.getElementById("src");
SRC.value = DEFAULT_SRC;

function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderTokens(toks) {
  const box = document.getElementById("tokens");
  box.innerHTML = toks.map(t => {
    const cls = t.kind === "KEYWORD" ? "kw" : t.kind === "NUMBER" ? "num" : t.kind === "STRING" ? "str" : t.kind === "NEWLINE" ? "nl" : "";
    const label = t.kind === "NEWLINE" ? "⏎" : t.kind === "STRING" ? '"' + t.value + '"' : t.value;
    const title = t.kind + " @行" + t.line + "列" + t.col;
    return '<span class="tok ' + cls + '" title="' + title + '">' + esc(label) + "</span>";
  }).join("");
}

function renderAST(node) {
  if (node === null || node === undefined) return '<span class="val">null</span>';
  if (typeof node !== "object") return '<span class="val">' + esc(node) + "</span>";
  if (Array.isArray(node)) {
    if (!node.length) return '<span class="val">[]</span>';
    return "<ul>" + node.map(n => "<li>" + renderAST(n) + "</li>").join("") + "</ul>";
  }
  const kids = Object.entries(node).filter(([, v]) => v !== null && v !== undefined && !(typeof v === "object" && Object.keys(v).length === 0));
  const head = '<span class="node">' + esc(node.type) + "</span>";
  if (!kids.length) return head;
  const body = kids.map(([k, v]) => {
    if (v && typeof v === "object") return "<li><span class='fld'>" + k + "</span>: " + renderAST(v) + "</li>";
    return "<li><span class='fld'>" + k + "</span>: <span class='val'>" + esc(v) + "</span></li>";
  }).join("");
  return head + "<ul>" + body + "</ul>";
}

function showBanner(cls, html) {
  const b = document.getElementById("banner");
  b.className = "banner show " + cls;
  b.innerHTML = html;
}

document.getElementById("parse-btn").addEventListener("click", () => {
  const src = SRC.value;
  let toks = null;
  try {
    toks = lex(src);
    const ast = new Parser(toks).parseProgram();
    renderTokens(toks);
    document.getElementById("ast").innerHTML = renderAST(ast);
    showBanner("ok", "✅ 词法 + 语法通过：" + toks.filter(t => t.kind !== "NEWLINE" && t.kind !== "EOF").length + " 个 token，AST 已生成");
  } catch (e) {
    if (e.lex || e.parse) {
      const where = "第 " + e.line + " 行，第 " + e.col + " 列";
      if (e.lex) document.getElementById("tokens").innerHTML = '<span class="stx">词法中止</span>';
      else renderTokens(toks);
      document.getElementById("ast").innerHTML = '<span class="stx">解析中止</span>';
      showBanner("err", "❌ <code>" + esc(e.msg) + "</code> —— " + where);
    } else {
      console.error(e);
      showBanner("err", "内部错误：" + esc(e.message));
    }
  }
});

document.getElementById("reset-btn").addEventListener("click", () => { SRC.value = DEFAULT_SRC; });

// 初始解析一次
document.getElementById("parse-btn").click();
</script>
